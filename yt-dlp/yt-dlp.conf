# Download location and file naming
-o "../Downloads/%(title)s [%(uploader_id)s] [%(id)s].%(ext)s"

# For EJS, which is required for full YouTube support
--js-runtimes node

# Metadata
--embed-thumbnail

# FFMPEG (Points to the directory containing ffmpeg.exe and ffprobe.exe)
